spring:
  application:
    name: qianxun-homestay-backend
  datasource:
    url: "${DATABASE_URL:jdbc:mysql://localhost:3306/qianxun?user=qianxun&password=qianxun&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    member-expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:2592000}
    admin-expiration-seconds: ${ADMIN_JWT_EXPIRATION_SECONDS:28800}
  auth:
    default-avatar: ${MEMBER_DEFAULT_AVATAR:/assets/avatar-default.webp}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

logging:
  level:
    com.qianxun.homestay.modules: INFO
    org.springframework.security: WARN
