spring:
  application:
    name: qianxun-homestay-backend
  datasource:
    url: "${DATABASE_URL:jdbc:mysql://localhost:3306/qianxun?user=qianxun&password=qianxun&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  payment:
    wechat:
      enabled: ${WECHAT_PAY_ENABLED:false}
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
      merchant-id: ${WECHAT_PAY_MCH_ID:}
      merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
      public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      payment-notify-url: ${WECHAT_PAY_NOTIFY_URL:}
      refund-notify-url: ${WECHAT_REFUND_NOTIFY_URL:}
  channel:
    mini-program-id: ${APP_MINI_PROGRAM_CHANNEL_ID:1}
  jwt:
    secret: ${JWT_SECRET:}
    member-expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:2592000}
    admin-expiration-seconds: ${ADMIN_JWT_EXPIRATION_SECONDS:28800}
  auth:
    default-avatar: ${MEMBER_DEFAULT_AVATAR:/assets/member-default-avatar.png}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

booking:
  payment-timeout-scan-interval-ms: ${BOOKING_PAYMENT_TIMEOUT_SCAN_INTERVAL_MS:30000}

logging:
  level:
    com.qianxun.homestay.common.logging: INFO
    com.qianxun.homestay.modules: INFO
    org.springframework.security: WARN
