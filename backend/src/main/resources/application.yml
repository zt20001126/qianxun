spring:
  application:
    name: qianxun-homestay-backend
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 300ms
      timeout: 200ms
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  datasource:
    url: "${DATABASE_URL:jdbc:mysql://localhost:3306/qianxun?user=qianxun&password=qianxun&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: 465
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  health:
    redis:
      enabled: false
    # 邮件发送失败由通知模块记录，SMTP 故障时订房和后台 API 仍可使用。
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  display-cache:
    room-ttl: 120s
    product-ttl: 120s
    page-ttl: 30s
    image-ttl: 50m
    page-size: 20
    max-pages: 5
  agent:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
  payment:
    wechat:
      enabled: ${WECHAT_PAY_ENABLED:false}
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
      merchant-id: ${WECHAT_PAY_MCH_ID:}
      merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
      public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      payment-notify-url: ${WECHAT_PAY_NOTIFY_URL:}
      refund-notify-url: ${WECHAT_REFUND_NOTIFY_URL:}
  channel:
    mini-program-id: ${APP_MINI_PROGRAM_CHANNEL_ID:1}
  jwt:
    secret: ${JWT_SECRET:}
    member-expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:2592000}
    admin-expiration-seconds: ${ADMIN_JWT_EXPIRATION_SECONDS:2592000}
  auth:
    default-avatar: ${MEMBER_DEFAULT_AVATAR:/assets/member-default-avatar.png}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cos:
    region: ${COS_REGION:}
    bucket: ${COS_BUCKET:}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    public-base-url: ${COS_PUBLIC_BASE_URL:}
  mail-notification:
    recipients: ${MAIL_NOTIFICATION_RECIPIENTS:}
    sender-name: ${MAIL_SENDER_NAME:芊浔民宿}
    from-email: ${SMTP_FROM_EMAIL:}
    daily-room-status-cron: ${MAIL_DAILY_ROOM_STATUS_CRON:0 0 10,18 * * *}

booking:
  payment-timeout-scan-interval-ms: ${BOOKING_PAYMENT_TIMEOUT_SCAN_INTERVAL_MS:30000}

logging:
  level:
    com.qianxun.homestay.common.logging: INFO
    com.qianxun.homestay.modules: INFO
    org.springframework.security: WARN
