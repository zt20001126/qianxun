        // ==========================================
        // 2. 日期工具函数 (精确处理跨月与未来60天校验)
        // ==========================================
        const WEEK_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

        function parseYMD(ymd) {
            const [y, m, d] = ymd.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatYMD(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function addDays(ymd, days) {
            const dt = parseYMD(ymd);
            dt.setDate(dt.getDate() + days);
            return formatYMD(dt);
        }

        function diffDays(startYmd, endYmd) {
            const s = parseYMD(startYmd);
            const e = parseYMD(endYmd);
            return Math.round((e - s) / 86400000);
        }

        function formatMonthDay(ymd) {
            const dt = parseYMD(ymd);
            return `${dt.getMonth() + 1}月${dt.getDate()}日`;
        }

        function formatWeek(ymd) {
            return WEEK_NAMES[parseYMD(ymd).getDay()];
        }

        // 获取 [checkIn, checkOut) 区间内所有住宿夜晚 YYYY-MM-DD（含入住日、不含退房日）
        function getStayNightsList(checkIn, checkOut) {
            const list = [];
            const n = diffDays(checkIn, checkOut);
            for (let i = 0; i < n; i++) {
                list.push(addDays(checkIn, i));
            }
            return list;
        }

        // 检查房间在整个 [checkIn, checkOut) 区间是否可订
        function isRoomAvailable(room, checkIn, checkOut) {
            const stayNights = getStayNightsList(checkIn, checkOut);
            return !stayNights.some(d => room.unavailableDates.includes(d));

        // ==========================================
        // 4. 会员等级 & 积分精确计算引擎 (V3.1 契约)
        // ==========================================
        function getCurrentTier() {
            const gp = state.member.growthPoints;
            return MEMBER_TIERS.slice().reverse().find(t => gp >= t.minPoints) || MEMBER_TIERS[0];
        }

        function getNextTier() {
            const cur = getCurrentTier();
            const idx = MEMBER_TIERS.findIndex(t => t.key === cur.key);
            return MEMBER_TIERS[idx + 1] || null;
        }

        // 严格遵循 V3.1 第 1.3 & 3.5 节：
        // 积分使用量为非负整数；抵扣金额 floor(points_used / rate * 100) / 100；单笔上限房费 20%
        function calculatePointsDeduction(roomFee) {
            const tier = getCurrentTier();
            const maxDiscountYuan = Number((roomFee * 0.20).toFixed(2));
            const maxPointsByCap = Math.floor(maxDiscountYuan * tier.rate);
            const usablePoints = Math.min(state.member.availablePoints, maxPointsByCap);
            // 取兑换率整数倍，使抵扣金额为干净整数元或精确两位小数
            const alignedPoints = Math.floor(usablePoints / tier.rate) * tier.rate;
            const discountYuan = Math.floor((alignedPoints * 100) / tier.rate) / 100;

            return {
                tier,
                rate: tier.rate,
                maxDiscountYuan,
                alignedPoints,
                discountYuan
            };
        }

        function maskPhone(phone) {
            const clean = String(phone || '').replace(/\s+/g, '');
            if (clean.length === 11) {

            }
            return clean;
        }

            pill.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                pill.classList.remove('opacity-100', 'translate-y-0');
                pill.classList.add('opacity-0', '-translate-y-2');
            }, 2300);
        }

            if (!state.agreedTerms) {

                return;

            const rawDigits = state.loginPhone.replace(/\D/g, '');
            if (rawDigits.length !== 11 || !/^1[3-9]\d{9}$/.test(rawDigits)) {
                showToast('请输入正确的11位手机号');
                return;
            }
            // 按 V3.1 规则匹配或自动创建会员，昵称固定为手机号后四位
            const tail4 = rawDigits.slice(-4);
            state.member.nickname = tail4;
            if (rawDigits === '13800005678') {
                state.member.growthPoints = 680;
                state.member.availablePoints = 1200;
            } else if (rawDigits === '13900008899') {
                state.member.growthPoints = 1260;
                state.member.availablePoints = 2400;
            } else if (rawDigits === '13600009999') {
                state.member.growthPoints = 1880;
                state.member.availablePoints = 3600;
            } else {
                state.member.growthPoints = 0;
                state.member.availablePoints = 0;
            }
            state.bookingForm.guestPhone = rawDigits.replace(/(\d{3})(\d{4})(\d{4})/, '$1 $2 $3');
            state.isLoggedIn = true;
            showToast(`登录成功，欢迎尾号 ${tail4} 会员`);
            navigateTo('home');

        function adjustBookingGuests(delta) {
            const room = ROOMS.find(r => r.id === state.selectedRoomId) || ROOMS[0];

            if (next >= 1 && next <= room.guests) {

                render();

                showToast(`该房型最多可入住 ${room.guests} 人`);

            if (state.member.availablePoints < getCurrentTier().rate) {

            render();

        // 接口 P01 + P08: 临时锁房10分钟 -> 后端模拟支付成功并生成正式订单（初始 PENDING_CONFIRM）
        function executeMockPay(roomFee, usedPoints, discountAmount, paidAmount) {
            if (!state.bookingForm.guestName.trim()) {
                showToast('请填写预订人姓名');
                return;
            }
            if (!/^1[3-9]\d{9}$/.test(state.bookingForm.guestPhone.replace(/\s+/g, ''))) {
                showToast('请填写正确的联系手机号码');
                return;
            }

            const room = ROOMS.find(r => r.id === state.selectedRoomId) || ROOMS[0];
            const nights = Math.max(1, diffDays(state.checkIn, state.checkOut));
            const seq = String(state.orders.length + 1).padStart(4, '0');
            const orderNo = `QX20261118${seq}`;

            const newOrder = {
                orderId: orderNo,
                roomId: room.id,
                roomName: room.name,
                image: room.images[0],
                checkIn: state.checkIn,
                checkOut: state.checkOut,
                nights,
                guestsCount: state.bookingForm.guestsCount,
                guestName: state.bookingForm.guestName.trim(),
                guestPhone: state.bookingForm.guestPhone.trim(),
                remark: state.bookingForm.remark.trim() || '无',
                unitPrice: room.price,
                roomFee,
                usedPoints,
                discountAmount,
                paidAmount,
                status: 'PENDING_CONFIRM',
                statusLabel: '待确认',
                refundable: true,
                refundHint: '可在入住当天 18:00（北京时间）前自助申请取消退款。',
                createdAt: '2026-11-18 11:02'
            };

            // 占用对应住宿夜晚，防止重复预订
            const stayNights = getStayNightsList(state.checkIn, state.checkOut);
            room.unavailableDates = Array.from(new Set([...room.unavailableDates, ...stayNights]));

            // 扣减积分并记录含 balance_after 的积分流水
            if (usedPoints > 0) {
                state.member.availablePoints -= usedPoints;
                state.pointsLogs.unshift({
                    id: Date.now(),
                    month: '2026年11月',
                    title: '抵扣订单房费',
                    sub: `订单：${orderNo}`,
                    time: '11月18日 11:02',
                    delta: -usedPoints,
                    balanceAfter: state.member.availablePoints,
                    icon: 'ticket'
                });
            }

            state.orders.unshift(newOrder);
            state.lastCreatedOrder = newOrder;
            state.selectedOrderId = orderNo;
            navigateTo('success');

            const order = state.orders.find(o => o.orderId === state.selectedOrderId) || state.orders[0];
            const showCancelBtn = order.status !== 'CANCELLED';

            const footer = document.getElementById('sticky-footer');
            footer.classList.remove('hidden');
            footer.innerHTML = `

        // 接口 P03: 同步模拟退款并返还积分、释放间夜
        function confirmOrderRefund(orderId) {
            const order = state.orders.find(o => o.orderId === orderId);
            if (!order) return;
            order.status = 'CANCELLED';
            order.statusLabel = '已取消';
            order.refundable = false;
            order.refundHint = '订单已取消，房费及已使用积分已全额退还。';

            // 释放房间对应住宿夜晚
            const room = ROOMS.find(r => r.id === order.roomId);
            if (room) {
                const releasedNights = getStayNightsList(order.checkIn, order.checkOut);
                room.unavailableDates = room.unavailableDates.filter(d => !releasedNights.includes(d));
            }

            // 返还已抵扣积分并写入含 balance_after 的积分流水
            if (order.usedPoints > 0) {
                state.member.availablePoints += order.usedPoints;
                state.pointsLogs.unshift({
                    id: Date.now(),
                    month: '2026年11月',
                    title: '取消订单返还',
                    sub: `订单：${order.orderId}`,
                    time: '11月18日 11:05',
                    delta: +order.usedPoints,
                    balanceAfter: state.member.availablePoints,
                    icon: 'rotate-ccw'
                });
            }

            closeDialog();
            showToast('模拟退款成功，房间已释放且积分已返还');
            render();

        // 【08-我的（个人中心）】完全复刻 08-我的.png + V3.1 第 3.7 节（统一默认头像 + 手机号后四位昵称）

                        <button onclick="navigateTab('orders')" class="w-full p-4 flex items-center justify-between hover:bg-ink-paper/60 transition">
                            <div class="flex items-center gap-3">

        function logoutToLogin() {
            state.isLoggedIn = false;
            navigateTo('login');

        // ==========================================
        // 7. 未来 60 个自然日交互日历抽屉 (V3.1 第 3.2 节)
        // ==========================================
        function openCalendarDrawer(roomId = null) {
            state.calendarContextRoomId = roomId;
            state.tempCheckIn = state.checkIn;
            state.tempCheckOut = state.checkOut;
            state.selectingStep = 'checkin';
            document.getElementById('calendar-drawer').classList.remove('hidden');
            renderCalendarMonths();
            lucide.createIcons();
        }

        function closeCalendarDrawer() {
            document.getElementById('calendar-drawer').classList.add('hidden');
        }

        function renderCalendarMonths() {
            const container = document.getElementById('calendar-months-container');
            const nights = Math.max(1, diffDays(state.tempCheckIn, state.tempCheckOut));
            const maxAllowedDate = addDays(TODAY_STR, MAX_WINDOW_DAYS - 1); // 今天为第1天，共60个自然日

            document.getElementById('cal-nights-badge').textContent = `共 ${nights} 晚`;
            document.getElementById('cal-confirm-nights').textContent = nights;
            document.getElementById('cal-preview-in').textContent = `${formatMonthDay(state.tempCheckIn)} ${formatWeek(state.tempCheckIn)}`;
            document.getElementById('cal-preview-out').textContent = `${formatMonthDay(state.tempCheckOut)} ${formatWeek(state.tempCheckOut)}`;

            const targetRoom = state.calendarContextRoomId
                ? ROOMS.find(r => r.id === state.calendarContextRoomId)
                : null;

            // 覆盖 2026-11、2026-12、2027-01 三个月以完整呈现未来 60 天
            const months = [
                { year: 2026, month: 11, days: 30, firstWeekday: 0 }, // 2026-11-01 周日
                { year: 2026, month: 12, days: 31, firstWeekday: 2 }, // 2026-12-01 周二
                { year: 2027, month: 1,  days: 31, firstWeekday: 5 }  // 2027-01-01 周五
            ];

            container.innerHTML = months.map(m => {
                let cells = '';
                for (let b = 0; b < m.firstWeekday; b++) {
                    cells += `<div></div>`;
                }
                for (let d = 1; d <= m.days; d++) {
                    const ymd = `${m.year}-${String(m.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const outOfWindow = ymd < TODAY_STR || ymd > maxAllowedDate;
                    const isRoomBlocked = targetRoom ? targetRoom.unavailableDates.includes(ymd) : false;
                    const isStart = ymd === state.tempCheckIn;
                    const isEnd = ymd === state.tempCheckOut;
                    const inRange = ymd > state.tempCheckIn && ymd < state.tempCheckOut;

                    let cls = 'h-10 flex flex-col items-center justify-center rounded-xl text-xs transition ';
                    let clickable = !outOfWindow;

                    if (outOfWindow) {
                        cls += 'text-ink-gray/30 cursor-not-allowed';
                    } else if (isStart || isEnd) {
                        cls += 'bg-ink-wood text-white font-bold shadow-2xs cursor-pointer';
                    } else if (inRange) {
                        cls += 'bg-ink-woodLight text-ink-wood font-medium cursor-pointer';
                    } else if (isRoomBlocked) {
                        cls += 'bg-ink-warm/80 text-ink-gray/60 cursor-pointer';
                    } else {
                        cls += 'text-ink-charcoal hover:bg-ink-paper cursor-pointer';
                    }

                    cells += `
                        <div ${clickable ? `onclick="pickCalendarDate('${ymd}')"` : ''} class="${cls}">
                            <span>${ymd === TODAY_STR ? '今' : d}</span>
                            ${isStart ? '<span class="text-[9px] leading-none mt-0.5">入住</span>' : ''}
                            ${isEnd ? '<span class="text-[9px] leading-none mt-0.5">退房</span>' : ''}
                            ${!isStart && !isEnd && isRoomBlocked && !outOfWindow ? '<span class="text-[8px] leading-none mt-0.5">已满</span>' : ''}
                        </div>
                    `;
                }

                return `
                    <div class="bg-white rounded-2xl p-3.5 border border-ink-border/70">
                        <div class="text-center font-serif font-bold text-xs text-ink-charcoal mb-2.5">${m.year}年 ${m.month}月</div>
                        <div class="grid grid-cols-7 text-center text-[10px] text-ink-gray mb-1.5">
                            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                        </div>
                        <div class="grid grid-cols-7 gap-y-1 text-center">
                            ${cells}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function pickCalendarDate(ymd) {
            const maxAllowedDate = addDays(TODAY_STR, MAX_WINDOW_DAYS - 1);
            if (state.selectingStep === 'checkin' || ymd <= state.tempCheckIn) {
                if (ymd >= maxAllowedDate) {
                    showToast('入住日期需留出至少 1 晚退房窗口');
                    return;
                }
                state.tempCheckIn = ymd;
                state.tempCheckOut = addDays(ymd, 1);
                state.selectingStep = 'checkout';
            } else {
                state.tempCheckOut = ymd;
                state.selectingStep = 'checkin';
            }
            renderCalendarMonths();
        }

        function confirmCalendarSelection() {
            state.checkIn = state.tempCheckIn;
            state.checkOut = state.tempCheckOut;
            closeCalendarDrawer();
            showToast(`已更新行程：${formatMonthDay(state.checkIn)} - ${formatMonthDay(state.checkOut)}（共${diffDays(state.checkIn, state.checkOut)}晚）`);
            render();
        }

        // ==========================================
        // 8. 总控渲染引擎
        // ==========================================
        function render() {
            syncChrome();
            const viewport = document.getElementById('viewport');

            const views = {
                'login': renderLoginPage,
                'home': renderHomePage,
                'rooms': renderRoomsPage,
                'detail': renderDetailPage,
                'booking': renderBookingPage,
                'success': renderSuccessPage,
                'orders': renderOrdersPage,
                'orderDetail': renderOrderDetailPage,
                'member': renderMemberPage,
                'pointsLog': renderPointsLogPage,
                'mine': renderMinePage
            };

            const renderFn = views[state.route] || renderHomePage;
            viewport.innerHTML = renderFn();
            lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
