        // =========================================================================
        function parseYMD(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }
        function fmtYMD(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }
        function addDays(ymd, n) {
            const d = parseYMD(ymd);
            d.setDate(d.getDate() + n);
            return fmtYMD(d);
        }
        function diffDays(a, b) {
            return Math.round((parseYMD(b) - parseYMD(a)) / 86400000);
        }
        function getNightsArray(checkIn, checkOut) {
            const arr = [];
            const n = diffDays(checkIn, checkOut);
            for (let i = 0; i < n; i++) arr.push(addDays(checkIn, i));
            return arr;
        }
        function fmtMoney(num) {
            return Number(num || 0).toFixed(2);
        }

        // 实时计算单笔订单额外提成与商家到手金额
        function calcOrderAmounts(amt) {
            const paid = Number(amt.paid_amount || 0);
            const fee = Number(amt.platform_fee || 0);
            const pComm = Number(amt.platform_commission || 0);
            let eComm = 0;
            if (amt.expected_amount !== null && amt.expected_amount !== '' && !isNaN(Number(amt.expected_amount))) {
                eComm = Math.max(0, Number((paid - fee - pComm - Number(amt.expected_amount)).toFixed(2)));
            } else {
                eComm = Number(amt.extra_commission || 0);
            }
            const net = Number((paid - fee - pComm - eComm).toFixed(2));
            return { paid, fee, pComm, eComm, net };
        }

        function checkRangeConflict(roomId, checkIn, checkOut, ignoreOrderId = null) {
            const targetNights = getNightsArray(checkIn, checkOut);
            if (targetNights.length <= 0) return '退房日期必须晚于入住日期';

            for (const o of ORDERS) {
                if (o.status === 'CANCELLED' || o.room_id !== Number(roomId)) continue;
                if (ignoreOrderId && o.id === Number(ignoreOrderId)) continue;
                const oNights = getNightsArray(o.check_in, o.check_out);
                if (targetNights.some(d => oNights.includes(d))) {
                    return `与有效订单 ${o.order_no}（${o.check_in} ~ ${o.check_out}）住宿日期重叠`;
                }
            }

            for (const b of ROOM_BLOCKS) {
                if (b.room_id !== Number(roomId)) continue;
                const bNights = getNightsArray(b.start_date, b.end_date);
                if (targetNights.some(d => bNights.includes(d))) {
                    return `与管理员封房（${b.start_date} ~ ${b.end_date}，${b.reason || '封房'}）冲突，请先解封`;
                }
            }

            for (const lk of BOOKING_LOCKS) {
                if (lk.room_id !== Number(roomId) || lk.status !== 'PENDING') continue;
                const lNights = getNightsArray(lk.check_in, lk.check_out);
                if (targetNights.some(d => lNights.includes(d))) {
                    return `该房间当前存在小程序未过期的 10 分钟临时锁房，请稍后再试`;
                }
            }

            return null;
        }

        // 将单笔订单金额按住宿间夜平均分摊，分币尾差归最后一晚（V3.1 第 13 节第 2 条）
        function allocateOrderToMonth(order, targetMonth) {
            const nights = getNightsArray(order.check_in, order.check_out);
            const totalN = nights.length;
            if (totalN === 0) return { nights: 0, paid: 0, fee: 0, pComm: 0, eComm: 0, net: 0 };

            const { paid, fee, pComm, eComm, net } = calcOrderAmounts(order.amount);

            function splitMetric(totalVal) {
                const totalCents = Math.round(totalVal * 100);
                const baseCents = Math.floor(totalCents / totalN);
                const remainder = totalCents - baseCents * totalN;
                let monthCents = 0;
                nights.forEach((d, idx) => {
                    if (d.startsWith(targetMonth)) {
                        monthCents += baseCents + (idx === totalN - 1 ? remainder : 0);
                    }
                });
                return monthCents / 100;
            }

            const monthNights = nights.filter(d => d.startsWith(targetMonth)).length;
            return {
                nights: monthNights,
                paid: splitMetric(paid),
                fee: splitMetric(fee),
                pComm: splitMetric(pComm),
                eComm: splitMetric(eComm),
                net: splitMetric(net)
            };
        }

        // 计算月度统计与四维报表（严格按 V3.1 统计口径）
        function computeMonthlyMetrics(month, scope = 'ALL') {
            const validStatuses = ['PENDING_CONFIRM', 'PENDING_CHECKIN', 'CHECKED_IN', 'COMPLETED'];
            const notCheckedInStatuses = ['PENDING_CONFIRM', 'PENDING_CHECKIN'];
            const checkedInStatuses = ['CHECKED_IN', 'COMPLETED'];

            const matchScope = (status) => {
                if (!validStatuses.includes(status)) return false;
                if (scope === 'NOT_CHECKED_IN') return notCheckedInStatuses.includes(status);
                if (scope === 'CHECKED_IN') return checkedInStatuses.includes(status);
                return true;
            };

            let orderCount = 0;
            let nightCount = 0;
            let paidAmount = 0;
            let platformFee = 0;
            let platformCommission = 0;
            let extraCommission = 0;
            let netAmount = 0;

            let unoccupiedOrderRevenue = 0;
            let checkedInOrderRevenue = 0;
            let checkedInNetTotal = 0; // 净利润固定只取已入住订单当月到手金额
            let checkedInNightsTotal = 0; // 入住率分子

            ORDERS.forEach(o => {
                if (!validStatuses.includes(o.status)) return;
                const alloc = allocateOrderToMonth(o, month);

                // 固定口径指标（不受 scope 筛选改变）
                if (notCheckedInStatuses.includes(o.status)) {
                    unoccupiedOrderRevenue += alloc.paid;
                }
                if (checkedInStatuses.includes(o.status)) {
                    checkedInOrderRevenue += alloc.paid;
                    checkedInNetTotal += alloc.net;
                    checkedInNightsTotal += alloc.nights;
                }

                // 随 scope 筛选变化的指标
                if (matchScope(o.status)) {
                    if (o.check_in.startsWith(month)) orderCount += 1; // 订单数只归属入住日期所在月份
                    nightCount += alloc.nights;
                    paidAmount += alloc.paid;
                    platformFee += alloc.fee;
                    platformCommission += alloc.pComm;
                    extraCommission += alloc.eComm;
                    netAmount += alloc.net;
                }
            });

            // 当月经营支出（按实际支出日期 date 统计）
            const expenseAmount = EXPENSES
                .filter(e => e.date.startsWith(month))
                .reduce((sum, e) => sum + Number(e.amount), 0);

            // 净利润 = 已入住订单当月到手金额 - 当月实际经营支出（不受 scope 筛选影响）
            const operatingProfit = checkedInNetTotal - expenseAmount;

            // 计算当月总日历间夜与封房间夜
            const [y, m] = month.split('-').map(Number);
            const daysInMonth = new Date(y, m, 0).getDate();
            const totalCalendarNights = ROOMS.length * daysInMonth;

            let blockedNights = 0;
            ROOM_BLOCKS.forEach(b => {
                blockedNights += getNightsArray(b.start_date, b.end_date).filter(d => d.startsWith(month)).length;
            });

            const denom = totalCalendarNights - blockedNights;
            const occupancyRate = denom > 0 ? ((checkedInNightsTotal / denom) * 100).toFixed(1) + '%' : '—';

            return {
                orderCount, nightCount,
                paidAmount, platformFee, platformCommission, extraCommission, netAmount,
                unoccupiedOrderRevenue, checkedInOrderRevenue,
                expenseAmount, operatingProfit,
                checkedInNightsTotal, totalCalendarNights, blockedNights, occupancyRate
            };
        }

            if (gp >= 1000) return { name: '金卡会员', badge: 'bg-yellow-50 text-yellow-800 border-yellow-300', rate: 20 };

                    </div>

                    <!-- 横向滚动房态矩阵表格 -->
                    <div class="bg-white rounded-2xl border border-ink-border overflow-x-auto shadow-2xs">
                        <table class="w-full border-collapse text-xs min-w-[1180px]">
                            <thead>
                                <tr class="bg-ink-paper border-b border-ink-border">
                                    <th class="sticky left-0 z-20 bg-ink-paper px-4 py-3 text-left font-serif font-bold text-ink-charcoal border-r border-ink-border w-36">
                                        房号 / 房型
                                    </th>
                                    ${dateCols.map(d => {
                                        const dayNum = d.slice(8);
                                        const isToday = d === TODAY;
                                        return `
                                            <th class="px-1 py-2 text-center border-r border-ink-border/60 min-w-[54px] ${isToday ? 'bg-ink-woodLight text-ink-wood font-bold' : 'text-ink-gray font-medium'}">
                                                <div>${dayNum}日</div>
                                                ${isToday ? '<div class="text-[9px] text-ink-cinnabar">今天</div>' : ''}

                            <tbody class="divide-y divide-ink-border">
                                ${ROOMS.map(room => `
                                    <tr>
                                        <td class="sticky left-0 z-10 bg-white px-4 py-3 border-r border-ink-border">
                                            <div class="font-bold text-ink-charcoal">${room.number} · ${room.name}</div>

                                        ${dateCols.map(d => {
                                            const info = getCellRenderInfo(room.id, d);
                                            const clickAction = info.order
                                                ? `openOrderDetailModal(${info.order.id})`
                                                : info.block
                                                    ? `openEditBlockModal(${info.block.id})`
                                                    : `openNewExternalOrderModal(${room.id}, '${d}')`;
                                            return `
                                                <td onclick="${clickAction}" class="p-1 border-r border-ink-border/50 text-center cursor-pointer">
                                                    <div class="h-11 rounded-lg border flex flex-col items-center justify-center px-1 text-[10px] transition ${info.cls}">
                                                        <span>${info.label}</span>
                                                        ${info.order && info.type !== 'OCCUPIED_TAG' ? `<span class="text-[9px] opacity-85 truncate max-w-[46px]">${info.order.guest_name || '散客'}</span>` : ''}
                                                    </div>

                                        }).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // (3) 订单管理 Orders
        function renderOrders() {
            const filtered = ORDERS.filter(o => {
                if (ui.orderFilter.channel_id && String(o.channel_id) !== ui.orderFilter.channel_id) return false;
                if (ui.orderFilter.room_id && String(o.room_id) !== ui.orderFilter.room_id) return false;
                if (ui.orderFilter.status && o.status !== ui.orderFilter.status) return false;
                if (ui.orderFilter.keyword) {
                    const kw = ui.orderFilter.keyword.toLowerCase();
                    const hit = (o.order_no || '').toLowerCase().includes(kw) ||
                                (o.guest_name || '').toLowerCase().includes(kw) ||
                                (o.phone || '').includes(kw) ||
                                (o.platform_order_no || '').toLowerCase().includes(kw);
                    if (!hit) return false;
                }
                return true;
            });

            const statusBadge = {
                'PENDING_CONFIRM': ['待确认', 'bg-amber-50 text-amber-800 border-amber-200'],
                'PENDING_CHECKIN': ['待入住', 'bg-orange-50 text-orange-800 border-orange-200'],
                'CHECKED_IN':      ['已入住', 'bg-ink-woodLight text-ink-wood border-ink-wood/25'],
                'COMPLETED':       ['已完成', 'bg-ink-celadonBg text-ink-celadon border-ink-celadon/25'],
                'CANCELLED':       ['已取消', 'bg-red-50 text-ink-cinnabar border-red-200']
            };

            return `
                <div class="space-y-4 fade-in">
                    <!-- 筛选栏 -->
                    <div class="bg-white p-4 rounded-2xl border border-ink-border flex flex-wrap items-center gap-3">
                        <select onchange="ui.orderFilter.channel_id = this.value; renderApp()" class="px-3 py-2 rounded-xl bg-ink-paper border border-ink-border text-xs">
                            <option value="">全部来源渠道</option>
                            ${CHANNELS.map(c => `<option value="${c.id}" ${ui.orderFilter.channel_id === String(c.id) ? 'selected' : ''}>${c.name}</option>`).join('')}

                        <select onchange="ui.orderFilter.room_id = this.value; renderApp()" class="px-3 py-2 rounded-xl bg-ink-paper border border-ink-border text-xs">
                            <option value="">全部房间</option>
                            ${ROOMS.map(r => `<option value="${r.id}" ${ui.orderFilter.room_id === String(r.id) ? 'selected' : ''}>${r.number} · ${r.name}</option>`).join('')}
                        </select>

                        <select onchange="ui.orderFilter.status = this.value; renderApp()" class="px-3 py-2 rounded-xl bg-ink-paper border border-ink-border text-xs">
                            <option value="">全部订单状态</option>
                            <option value="PENDING_CONFIRM" ${ui.orderFilter.status === 'PENDING_CONFIRM' ? 'selected' : ''}>待确认</option>
                            <option value="PENDING_CHECKIN" ${ui.orderFilter.status === 'PENDING_CHECKIN' ? 'selected' : ''}>待入住</option>
                            <option value="CHECKED_IN" ${ui.orderFilter.status === 'CHECKED_IN' ? 'selected' : ''}>已入住</option>
                            <option value="COMPLETED" ${ui.orderFilter.status === 'COMPLETED' ? 'selected' : ''}>已完成</option>
                            <option value="CANCELLED" ${ui.orderFilter.status === 'CANCELLED' ? 'selected' : ''}>已取消</option>
                        </select>

                        <input type="text" value="${ui.orderFilter.keyword}" oninput="ui.orderFilter.keyword = this.value; renderApp()" placeholder="搜索订单号 / 预订人 / 手机号" class="px-3.5 py-2 rounded-xl bg-ink-paper border border-ink-border text-xs w-56 focus:outline-hidden focus:border-ink-wood">

                        <button onclick="ui.orderFilter = { channel_id: '', room_id: '', status: '', keyword: '' }; renderApp()" class="px-3 py-2 rounded-xl text-xs text-ink-gray hover:text-ink-charcoal">重置</button>
                    </div>

                    <!-- 订单明细表 -->
                    <div class="bg-white rounded-2xl border border-ink-border overflow-x-auto shadow-2xs">
                        <table class="w-full text-left border-collapse text-xs min-w-[1060px]">
                            <thead>
                                <tr class="bg-ink-paper border-b border-ink-border text-ink-gray">
                                    <th class="py-3 px-4 font-semibold">订单编号 / 来源</th>
                                    <th class="py-3 px-3 font-semibold">房间与入离日期</th>
                                    <th class="py-3 px-3 font-semibold">预订人与手机</th>
                                    <th class="py-3 px-3 font-semibold text-right">实付金额</th>
                                    <th class="py-3 px-3 font-semibold text-right">手续费 / 达人提成</th>
                                    <th class="py-3 px-3 font-semibold text-right">商家到手</th>
                                    <th class="py-3 px-3 font-semibold text-center">状态</th>
                                    <th class="py-3 px-4 font-semibold text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-ink-border/70">
                                ${filtered.map(o => {
                                    const room = ROOMS.find(r => r.id === o.room_id);
                                    const ch = CHANNELS.find(c => c.id === o.channel_id);
                                    const cr = o.creator_id ? CREATORS.find(x => x.id === o.creator_id) : null;
                                    const { paid, fee, pComm, eComm, net } = calcOrderAmounts(o.amount);
                                    const [sLabel, sCls] = statusBadge[o.status] || [o.status, ''];

                                    // 逐级状态流转按钮（O08 确认 -> O09 入住 -> O10 退房）
                                    let nextActionBtn = '';
                                    if (o.status === 'PENDING_CONFIRM') {
                                        nextActionBtn = `<button onclick="advanceOrderStatus(${o.id}, 'PENDING_CHECKIN')" class="px-2.5 py-1 rounded-lg bg-ink-wood text-white text-[11px] font-medium hover:bg-ink-woodDark">确认订单</button>`;
                                    } else if (o.status === 'PENDING_CHECKIN') {
                                        nextActionBtn = `<button onclick="advanceOrderStatus(${o.id}, 'CHECKED_IN')" class="px-2.5 py-1 rounded-lg bg-ink-celadon text-white text-[11px] font-medium hover:opacity-90">办理入住</button>`;
                                    } else if (o.status === 'CHECKED_IN') {
                                        nextActionBtn = `<button onclick="advanceOrderStatus(${o.id}, 'COMPLETED')" class="px-2.5 py-1 rounded-lg bg-ink-charcoal text-white text-[11px] font-medium hover:opacity-90">办理退房</button>`;
                                    }

                                    return `
                                        <tr class="hover:bg-ink-paper/45 transition">
                                            <td class="py-3.5 px-4">
                                                <div class="font-mono font-bold text-ink-charcoal">${o.order_no}</div>
                                                <div class="flex items-center gap-1.5 mt-1">
                                                    <span class="px-2 py-0.5 rounded bg-ink-woodLight text-ink-wood text-[10px] font-semibold">${ch ? ch.name : ''}</span>
                                                    ${cr ? `<span class="text-[10px] text-ink-gray">达人：${cr.name}</span>` : ''}
                                                </div>
                                            </td>
                                            <td class="py-3.5 px-3">
                                                <div class="font-semibold text-ink-charcoal">${room ? `${room.number} · ${room.name}` : ''}</div>
                                                <div class="text-[11px] text-ink-gray mt-0.5">${o.check_in} ~ ${o.check_out}（${diffDays(o.check_in, o.check_out)}晚）</div>
                                            </td>
                                            <td class="py-3.5 px-3">
                                                <div class="font-medium text-ink-charcoal">${o.guest_name || '—'} <span class="text-ink-gray">(${o.guest_count || 1}人)</span></div>
                                                <div class="text-[11px] text-ink-gray mt-0.5 font-mono">${o.phone || '未填手机号'}</div>
                                            </td>
                                            <td class="py-3.5 px-3 text-right font-mono font-bold text-ink-cinnabar">¥${fmtMoney(paid)}</td>
                                            <td class="py-3.5 px-3 text-right text-[11px] text-ink-gray font-mono">
                                                <div>手：¥${fmtMoney(fee)}</div>
                                                <div>佣：¥${fmtMoney(pComm + eComm)}</div>
                                            </td>
                                            <td class="py-3.5 px-3 text-right font-mono font-bold text-ink-celadon">¥${fmtMoney(net)}</td>
                                            <td class="py-3.5 px-3 text-center">
                                                <span class="px-2.5 py-0.5 rounded-full border text-[11px] font-semibold ${sCls}">${sLabel}</span>
                                            </td>
                                            <td class="py-3.5 px-4 text-right space-x-1.5 whitespace-nowrap">
                                                ${nextActionBtn}
                                                <button onclick="openOrderDetailModal(${o.id})" class="px-2.5 py-1 rounded-lg border border-ink-border text-ink-charcoal text-[11px] hover:bg-ink-paper">详情/编辑</button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // 状态逐级流转 + 退房自动发积分幂等逻辑（V3.1 O08–O10）
        function advanceOrderStatus(orderId, targetStatus) {
            const o = ORDERS.find(x => x.id === orderId);
            if (!o) return;

            if (targetStatus === 'CHECKED_IN' && TODAY < o.check_in) {
                showToast(`操作拒绝：不可早于预定入住日（${o.check_in}）办理入住`);
                return;
            }
            if (targetStatus === 'COMPLETED' && TODAY < o.check_out) {
                showToast(`操作拒绝：不可早于预定退房日（${o.check_out}）办理退房`);
                return;
            }

            o.status = targetStatus;
            if (targetStatus === 'COMPLETED') {
                triggerOrderCompletionReward(o);
            } else {
                showToast('订单状态已更新');
            }
            renderApp();
        }

        // 订单完成后自动奖励积分（floor(paid_amount)，小程序归属下单 member_id，第三方按有效手机号建/关联会员）
        function triggerOrderCompletionReward(order) {
            const rewardPts = Math.floor(Number(order.amount.paid_amount));
            if (rewardPts <= 0) return;

            // 幂等校验
            if (POINTS_LOGS.some(l => l.order_id === order.id && l.type === 'ORDER_REWARD')) return;

            let targetMember = null;
            if (order.channel_id === 1 && order.member_id) {
                targetMember = MEMBERS.find(m => m.id === order.member_id);
            } else if (order.channel_id !== 1 && order.phone && /^1[3-9]\d{9}$/.test(order.phone)) {
                targetMember = MEMBERS.find(m => m.phone === order.phone);
                if (!targetMember) {
                    targetMember = {
                        id: MEMBERS.length + 1,
                        phone: order.phone,
                        nickname: order.phone.slice(-4),
                        growth_points: 0,
                        points: 0,
                        created_at: `${TODAY} 12:00`
                    };
                    MEMBERS.unshift(targetMember);
                }
                order.member_id = targetMember.id;
            }

            if (targetMember) {
                targetMember.growth_points += rewardPts;
                targetMember.points += rewardPts;
                POINTS_LOGS.unshift({
                    id: POINTS_LOGS.length + 1,
                    member_id: targetMember.id,
                    order_id: order.id,
                    type: 'ORDER_REWARD',
                    points: rewardPts,
                    growth_points: rewardPts,
                    balance_after: targetMember.points,
                    amount: Number(order.amount.paid_amount),
                    discount_amount: null,
                    remark: `订单 ${order.order_no} 退房完成自动奖励`,
                    created_at: `${TODAY} 12:00`
                });
                showToast(`退房完成！已自动向尾号 ${targetMember.nickname} 发放 ${rewardPts} 积分`);
            } else {
                showToast('退房完成（无有效会员手机号，未触发积分奖励）');
            }
        }

        // 订单详情与编辑模态框（严格执行：所有状态金额字段只读不可改；仅待确认/待入住可改房或同晚数日期；第三方待确认/待入住可取消）
        function openOrderDetailModal(orderId) {
            const o = ORDERS.find(x => x.id === orderId);
            if (!o) return;
            const ch = CHANNELS.find(c => c.id === o.channel_id);
            const cr = o.creator_id ? CREATORS.find(c => c.id === o.creator_id) : null;
            const { paid, fee, pComm, eComm, net } = calcOrderAmounts(o.amount);
            const canEditRoomDate = ['PENDING_CONFIRM', 'PENDING_CHECKIN'].includes(o.status);
            const canCancelExternal = o.channel_id !== 1 && ['PENDING_CONFIRM', 'PENDING_CHECKIN'].includes(o.status);
            const nights = diffDays(o.check_in, o.check_out);

            openModal(`
                <div>
                    <div class="flex items-center justify-between pb-3 border-b border-ink-border">
                        <div>
                            <h3 class="font-serif font-bold text-base text-ink-charcoal">订单详情 · ${o.order_no}</h3>
                            <p class="text-[11px] text-ink-gray mt-0.5">来源：${ch ? ch.name : ''} ${cr ? `· 主播：${cr.name}` : ''} · 住宿 ${nights} 晚</p>
                        </div>
                        <button onclick="closeModal()" class="p-1.5 rounded-full hover:bg-ink-paper"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>

                    <div class="mt-4 space-y-4 text-xs">
                        <!-- 1. 固定显示顺序的金额与提成快照（只读，任何状态不可编辑） -->
                        <div class="p-3.5 rounded-2xl bg-ink-paper border border-ink-border space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-ink-woodDark">订单金额与提成快照（创建后锁定不可改）</span>
                                <span class="text-[10px] text-ink-gray">自动计算 net_amount</span>
                            </div>
                            <div class="grid grid-cols-3 gap-2 pt-1">
                                <div class="bg-white p-2 rounded-xl border border-ink-border/60">
                                    <div class="text-[10px] text-ink-gray">1. 顾客实付金额</div>
                                    <div class="font-mono font-bold text-ink-cinnabar text-sm mt-0.5">¥${fmtMoney(paid)}</div>
                                </div>
                                <div class="bg-white p-2 rounded-xl border border-ink-border/60">
                                    <div class="text-[10px] text-ink-gray">2. 平台手续费</div>
                                    <div class="font-mono font-semibold mt-0.5">¥${fmtMoney(fee)}</div>
                                </div>
                                <div class="bg-white p-2 rounded-xl border border-ink-border/60">
                                    <div class="text-[10px] text-ink-gray">3. 平台达人提成</div>
                                    <div class="font-mono font-semibold mt-0.5">¥${fmtMoney(pComm)}</div>
                                </div>
                                <div class="bg-white p-2 rounded-xl border border-ink-border/60">
                                    <div class="text-[10px] text-ink-gray">4. 达人额外提成</div>
                                    <div class="font-mono font-semibold mt-0.5">¥${fmtMoney(eComm)}</div>
                                </div>
                                <div class="bg-white p-2 rounded-xl border border-ink-border/60">
                                    <div class="text-[10px] text-ink-gray">5. 预期收入</div>
                                    <div class="font-mono font-semibold mt-0.5">${o.amount.expected_amount !== null ? `¥${fmtMoney(o.amount.expected_amount)}` : '—'}</div>
                                </div>
                                <div class="bg-ink-celadonBg/70 p-2 rounded-xl border border-ink-celadon/25">
                                    <div class="text-[10px] text-ink-celadon font-medium">6. 商家到手金额</div>
                                    <div class="font-mono font-bold text-ink-celadon text-sm mt-0.5">¥${fmtMoney(net)}</div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. 可编辑资料（O07 规则：全部状态可改联系人/备注；仅待确认/待入住可改房间/同晚数日期） -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-ink-gray mb-1">房间 ${canEditRoomDate ? '' : '(当前状态锁定)'}</label>
                                <select id="edit-ord-room" ${canEditRoomDate ? '' : 'disabled'} class="w-full px-3 py-2 rounded-xl bg-ink-paper border border-ink-border disabled:opacity-60">
                                    ${ROOMS.map(r => `<option value="${r.id}" ${o.room_id === r.id ? 'selected' : ''}>${r.number} · ${r.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-ink-gray mb-1">入住人数</label>
                                <input id="edit-ord-guests" type="number" min="1" max="4" value="${o.guest_count || 1}" class="w-full px-3 py-2 rounded-xl bg-ink-paper border border-ink-border">
                            </div>
                            <div>
                                <label class="block text-ink-gray mb-1">入住日期 ${canEditRoomDate ? `(须保持${nights}晚)` : '(锁定)'}</label>
                                <input id="edit-ord-in" type="date" value="${o.check_in}" ${canEditRoomDate ? '' : 'disabled'} class="w-full px-3 py-2 rounded-xl bg-ink-paper border border-ink-border disabled:opacity-60">
                            </div>
                            <div>
                                <label class="block text-ink-gray mb-1">退房日期 ${canEditRoomDate ? `(须保持${nights}晚)` : '(锁定)'}</label>
                                <input id="edit-ord-out" type="date" value="${o.check_out}" ${canEditRoomDate ? '' : 'disabled'} class="w-full px-3 py-2 rounded-xl bg-ink-paper border border-ink-border disabled:opacity-60">
                            </div>
                            <div>
                                <label class="block text-ink-gray mb-1">预订人姓名</label>
                                <input id="edit-ord-name" type="text" value="${o.guest_name || ''}" class="w-full px-3 py-2 rounded-xl bg-ink-paper border border-ink-border">
                            </div>
                            <div>
                                <label class="block text-ink-gray mb-1">预订手机号码</label>
                                <input id="edit-ord-phone" type="text" value="${o.phone || ''}" class="w-full px-3 py-2 rounded-xl bg-ink-paper border border-ink-border">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-ink-gray mb-1">订单备注</label>
                                <input id="edit-ord-remark" type="text" value="${o.remark || ''}" class="w-full px-3 py-2 rounded-xl bg-ink-paper border border-ink-border">
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-3 border-t border-ink-border">
                            <div>
                                ${canCancelExternal ? `
                                    <button onclick="cancelExternalOrder(${o.id})" class="px-3.5 py-2 rounded-xl border border-ink-cinnabar text-ink-cinnabar font-medium hover:bg-red-50 transition">
                                        取消第三方订单并释放房间
                                    </button>
                                ` : ''}
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-ink-border text-ink-gray">关闭</button>
                                <button onclick="saveOrderEdit(${o.id})" class="px-5 py-2 rounded-xl bg-ink-wood text-white font-medium hover:bg-ink-woodDark">保存修改</button>
                            </div>
                        </div>
                    </div>
                </div>
            `, 'max-w-2xl');
        }

        function saveOrderEdit(orderId) {
            const o = ORDERS.find(x => x.id === orderId);
            if (!o) return;
            const canEditRoomDate = ['PENDING_CONFIRM', 'PENDING_CHECKIN'].includes(o.status);

            if (canEditRoomDate) {
                const newRoomId = Number(document.getElementById('edit-ord-room').value);
                const newIn = document.getElementById('edit-ord-in').value;
                const newOut = document.getElementById('edit-ord-out').value;
                const oldNights = diffDays(o.check_in, o.check_out);
                const newNights = diffDays(newIn, newOut);

                if (newNights !== oldNights) {
                    showToast(`校验失败：修改后晚数（${newNights}晚）必须与原订单（${oldNights}晚）一致`);
                    return;
                }
                const conflict = checkRangeConflict(newRoomId, newIn, newOut, o.id);
                if (conflict) {
                    showToast(`日期冲突：${conflict}`);
                    return;
                }
                o.room_id = newRoomId;
                o.check_in = newIn;

        function onExtChannelOrCreatorChange() {
            const hasCreator = Boolean(document.getElementById('ext-creator').value);
            const pcommInput = document.getElementById('ext-pcomm');
            const expInput = document.getElementById('ext-expected');
            pcommInput.disabled = !hasCreator;
            expInput.disabled = !hasCreator;
            if (!hasCreator) {
                pcommInput.value = '0';
                expInput.value = '';
            }
            recalcExtPreview();
        }

        function recalcExtPreview() {
            const paid = Number(document.getElementById('ext-paid').value || 0);
            const fee = Number(document.getElementById('ext-fee').value || 0);
            const hasCreator = Boolean(document.getElementById('ext-creator').value);
            const pcomm = hasCreator ? Number(document.getElementById('ext-pcomm').value || 0) : 0;
            const expRaw = document.getElementById('ext-expected').value;
            const ecomm = (hasCreator && expRaw !== '') ? Math.max(0, paid - fee - pcomm - Number(expRaw)) : 0;
            const net = paid - fee - pcomm - ecomm;
            document.getElementById('ext-ecomm-preview').textContent = `¥${fmtMoney(ecomm)}`;
            document.getElementById('ext-net-preview').textContent = `¥${fmtMoney(net)}`;
        }

        function submitNewExternalOrder() {
            const channelId = Number(document.getElementById('ext-channel').value);
            const roomId = Number(document.getElementById('ext-room').value);
            const checkIn = document.getElementById('ext-checkin').value;
            const checkOut = document.getElementById('ext-checkout').value;
            const status = document.getElementById('ext-status').value;
            const creatorIdRaw = document.getElementById('ext-creator').value;
            const creatorId = creatorIdRaw ? Number(creatorIdRaw) : null;
            const paid = Number(document.getElementById('ext-paid').value);
            const fee = Number(document.getElementById('ext-fee').value || 0);
            const pcomm = creatorId ? Number(document.getElementById('ext-pcomm').value || 0) : 0;
            const expRaw = document.getElementById('ext-expected').value;
            const platNo = document.getElementById('ext-plat-no').value.trim() || null;

            if (!checkIn || !checkOut || diffDays(checkIn, checkOut) <= 0) {
                showToast('退房日期必须晚于入住日期');
                return;
            }
            if (isNaN(paid) || paid < 0) {
                showToast('请填写有效的顾客实付金额');
                return;
            }
            if (creatorId && (expRaw === '' || isNaN(Number(expRaw)))) {
                showToast('选择达人时必须填写「预期收入」以计算额外提成');
                return;
            }
            if (platNo && ORDERS.some(o => o.channel_id === channelId && o.platform_order_no === platNo)) {
                showToast(`防重拦截：该渠道已存在平台订单号 ${platNo}`);
                return;
            }

            const conflict = checkRangeConflict(roomId, checkIn, checkOut);
            if (conflict) {
                showToast(`占房冲突：${conflict}`);
                return;
            }

            const expectedAmount = creatorId ? Number(expRaw) : null;
            const extraCommission = creatorId ? Math.max(0, Number((paid - fee - pcomm - expectedAmount).toFixed(2))) : 0;

            const newOrder = {
                id: ORDERS.length + 101,
                order_no: `QX20261118${String(ORDERS.length + 1).padStart(4, '0')}`,
                platform_order_no: platNo,
                room_id: roomId,
                channel_id: channelId,
                creator_id: creatorId,
                member_id: null,
                guest_name: document.getElementById('ext-name').value.trim() || '外部平台宾客',
                phone: document.getElementById('ext-phone').value.trim() || null,
                guest_count: 2,
                check_in: checkIn,
                check_out: checkOut,
                status,
                remark: document.getElementById('ext-remark').value.trim(),
                created_at: `${TODAY} 16:05`,
                amount: {
                    paid_amount: paid,
                    platform_fee: fee,
                    platform_commission: pcomm,
                    extra_commission: extraCommission,
                    expected_amount: expectedAmount
                }
            };

            ORDERS.unshift(newOrder);
            if (status === 'COMPLETED') {
                triggerOrderCompletionReward(newOrder);
            } else {
                showToast(`外部订单 ${newOrder.order_no} 创建成功`);
            }
            closeModal();
            renderApp();
        }

        function submitNewMember() {
            const phone = document.getElementById('new-mem-phone').value.trim();
            const type = document.getElementById('new-mem-type').value;
            const pts = Math.max(0, Math.floor(Number(document.getElementById('new-mem-pts').value || 0)));
            const remark = document.getElementById('new-mem-remark').value.trim() || '后台建档初始发放';

            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showToast('请输入正确的 11 位手机号');
                return;
            }
            if (MEMBERS.some(m => m.phone === phone)) {
                showToast('该手机号会员已存在，请直接搜索发放积分');
                return;
            }

            const gp = (type === 'HISTORY_REWARD') ? pts : 0;
            const newMem = {
                id: MEMBERS.length + 1,
                phone,
                nickname: phone.slice(-4),
                growth_points: gp,
                points: pts,
                created_at: `${TODAY} 16:15`
            };
            MEMBERS.unshift(newMem);

            if (pts > 0) {
                POINTS_LOGS.unshift({
                    id: POINTS_LOGS.length + 1,
                    member_id: newMem.id,
                    order_id: null,
                    type,
                    points: pts,
                    growth_points: gp,
                    balance_after: pts,
                    amount: null,
                    discount_amount: null,
                    remark,
                    created_at: `${TODAY} 16:15`
                });
            }

            closeModal();
            showToast(`会员尾号 ${newMem.nickname} 建档成功`);
            renderApp();
        }

        function submitGrantPoints(memberId) {
            const m = MEMBERS.find(x => x.id === memberId);
            if (!m) return;
            const type = document.getElementById('gr-type').value;
            const pts = Math.floor(Number(document.getElementById('gr-pts').value));
            const remark = document.getElementById('gr-remark').value.trim() || (type === 'HISTORY_REWARD' ? '历史消费补发' : '管家赠送补偿');

            POINTS_LOGS.unshift({

                member_id: m.id,

                type,
                points: pts,
                growth_points: gpDelta,
                balance_after: m.points,
                amount: null,
                discount_amount: null,
                remark,
                created_at: `${TODAY} 16:20`
            });

            closeModal();
            showToast(`已成功向尾号 ${m.nickname} 发放 ${pts} 积分`);

                    <div class="bg-white p-5 rounded-2xl border border-ink-border h-fit">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="w-1 h-4 rounded-full bg-ink-wood"></span>
                            <h3 class="font-serif font-bold text-sm text-ink-charcoal">新增经营支出</h3>
                        </div>
                        <p class="text-[11px] text-ink-gray mb-4">按实际支出日期计入对应月份净利润。为保证账目严肃性，支出创建后不可编辑或删除。</p>

                        <div class="space-y-3 text-xs">
                            <div>
                                <label class="block text-ink-charcoal font-medium mb-1">支出内容 *</label>
                                <input id="exp-content" type="text" placeholder="如：采购洗漱用品 / 水电费 / 维修" class="w-full px-3 py-2 rounded-xl bg-ink-paper border border-ink-border">
                            </div>
                            <div>
                                <label class="block text-ink-charcoal font-medium mb-1">支出金额（元） *</label>
                                <input id="exp-amount" type="number" step="0.01" placeholder="0.00" class="w-full px-3 py-2 rounded-xl bg-ink-paper border border-ink-border font-mono">
                            </div>
                            <div>
                                <label class="block text-ink-charcoal font-medium mb-1">实际支出归属日期 *</label>
                                <input id="exp-date" type="date" value="${TODAY}" class="w-full px-3 py-2 rounded-xl bg-ink-paper border border-ink-border font-mono">
                            </div>
                            <button onclick="submitNewExpense()" class="w-full py-2.5 rounded-xl bg-ink-wood hover:bg-ink-woodDark text-white font-medium mt-2 transition">
                                确认记账
                            </button>
                        </div>
                    </div>

                    <!-- 右侧支出明细与月度汇总 -->
                    <div class="lg:col-span-2 bg-white p-5 rounded-2xl border border-ink-border">
                        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                            <div class="flex items-center gap-2">
                                <span class="w-1 h-4 rounded-full bg-ink-wood"></span>
                                <h3 class="font-serif font-bold text-sm text-ink-charcoal">${ui.month} 经营支出明细</h3>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-xs text-ink-gray">当月累计支出：<strong class="font-mono text-base text-ink-cinnabar">¥${fmtMoney(totalMonth)}</strong></span>
                                <select onchange="ui.month = this.value; renderApp()" class="px-3 py-1.5 rounded-xl bg-ink-paper border border-ink-border text-xs font-semibold">
                                    <option value="2026-11" ${ui.month === '2026-11' ? 'selected' : ''}>2026-11</option>
                                    <option value="2026-12" ${ui.month === '2026-12' ? 'selected' : ''}>2026-12</option>
                                </select>
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-ink-paper border-b border-ink-border text-ink-gray">
                                        <th class="py-2.5 px-4">实际支出日期</th>
                                        <th class="py-2.5 px-4">支出内容</th>
                                        <th class="py-2.5 px-4 text-right">支出金额</th>
                                        <th class="py-2.5 px-4 text-right">录入时间</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-ink-border/70">
                                    ${monthExpenses.length === 0 ? `
                                        <tr><td colspan="4" class="py-8 text-center text-ink-gray">该月份暂无经营支出记录</td></tr>
                                    ` : monthExpenses.map(e => `
                                        <tr>
                                            <td class="py-3 px-4 font-mono font-semibold">${e.date}</td>
                                            <td class="py-3 px-4 text-ink-charcoal">${e.content}</td>
                                            <td class="py-3 px-4 text-right font-mono font-bold text-ink-cinnabar">¥${fmtMoney(e.amount)}</td>
                                            <td class="py-3 px-4 text-right text-ink-gray font-mono">${e.created_at}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function submitNewExpense() {
            const content = document.getElementById('exp-content').value.trim();
            const amount = Number(document.getElementById('exp-amount').value);
            const date = document.getElementById('exp-date').value;
            if (!content || isNaN(amount) || amount <= 0 || !date) {
                showToast('请完整填写支出内容、正数金额及实际支出日期');
                return;
            }
            EXPENSES.unshift({
                id: EXPENSES.length + 1,
                content,
                amount,
                date,
                created_at: `${TODAY} 16:25`
            });
            showToast('经营支出已入账（创建后锁定不可改删）');
            renderApp();
        }

        // (8) 四维经营报表（Reports：总览 / 按来源 / 按主播含无主播 / 按房间含单房利润与入住率）
        function renderReports() {
            const m = computeMonthlyMetrics(ui.month, ui.reportScope);

            const validStatuses = ['PENDING_CONFIRM', 'PENDING_CHECKIN', 'CHECKED_IN', 'COMPLETED'];
            const matchScope = (status) => {
                if (!validStatuses.includes(status)) return false;
                if (ui.reportScope === 'NOT_CHECKED_IN') return ['PENDING_CONFIRM', 'PENDING_CHECKIN'].includes(status);
                if (ui.reportScope === 'CHECKED_IN') return ['CHECKED_IN', 'COMPLETED'].includes(status);
                return true;
            };

            // 按渠道分组统计
            const channelRows = CHANNELS.map(ch => {
                let order_count = 0, night_count = 0, paid = 0, fee = 0, pComm = 0, eComm = 0, net = 0;
                ORDERS.forEach(o => {
                    if (o.channel_id !== ch.id || !matchScope(o.status)) return;
                    if (o.check_in.startsWith(ui.month)) order_count++;
                    const a = allocateOrderToMonth(o, ui.month);
                    night_count += a.nights; paid += a.paid; fee += a.fee; pComm += a.pComm; eComm += a.eComm; net += a.net;
                });
                return { name: ch.name, order_count, night_count, paid, fee, pComm, eComm, net };
            });

            // 按达人分组统计（必须包含 creator_id=null 的「无主播订单」行）
            const creatorList = [{ id: null, name: '无主播订单（自然流量）' }, ...CREATORS];
            const creatorRows = creatorList.map(cr => {
                let order_count = 0, night_count = 0, paid = 0, fee = 0, pComm = 0, eComm = 0, net = 0;
                ORDERS.forEach(o => {
                    if ((o.creator_id || null) !== cr.id || !matchScope(o.status)) return;
                    if (o.check_in.startsWith(ui.month)) order_count++;
                    const a = allocateOrderToMonth(o, ui.month);
                    night_count += a.nights; paid += a.paid; fee += a.fee; pComm += a.pComm; eComm += a.eComm; net += a.net;
                });
                return { name: cr.name, order_count, night_count, paid, fee, pComm, eComm, net };
            });

            // 按房间分组统计（房间利润不扣全店支出；入住率分子只含已入住/已完成间夜）
            const [yy, mm] = ui.month.split('-').map(Number);
            const daysInMonth = new Date(yy, mm, 0).getDate();
            const roomRows = ROOMS.map(rm => {
                let order_count = 0, night_count = 0, paid = 0, fee = 0, pComm = 0, eComm = 0, net = 0;
                let checkedInNights = 0;
                ORDERS.forEach(o => {
                    if (o.room_id !== rm.id || !validStatuses.includes(o.status)) return;
                    const a = allocateOrderToMonth(o, ui.month);
                    if (['CHECKED_IN', 'COMPLETED'].includes(o.status)) checkedInNights += a.nights;
                    if (matchScope(o.status)) {
                        if (o.check_in.startsWith(ui.month)) order_count++;
                        night_count += a.nights; paid += a.paid; fee += a.fee; pComm += a.pComm; eComm += a.eComm; net += a.net;
                    }
                });
                let rmBlocked = 0;
                ROOM_BLOCKS.filter(b => b.room_id === rm.id).forEach(b => {
                    rmBlocked += getNightsArray(b.start_date, b.end_date).filter(d => d.startsWith(ui.month)).length;
                });
                const denom = daysInMonth - rmBlocked;
                const occRate = denom > 0 ? ((checkedInNights / denom) * 100).toFixed(1) + '%' : '—';
                return { name: `${rm.number} · ${rm.name}`, order_count, night_count, paid, fee, pComm, eComm, net, occRate };
            });

            const activeRows = ui.reportDimension === 'channels' ? channelRows
                             : ui.reportDimension === 'creators' ? creatorRows
                             : roomRows;

            return `
                <div class="space-y-5 fade-in">
                    <!-- 筛选与口径控制栏 -->
                    <div class="bg-white p-4 rounded-2xl border border-ink-border flex flex-wrap items-center justify-between gap-3">
                        <div class="flex flex-wrap items-center gap-1.5 bg-ink-paper p-1 rounded-xl border border-ink-border text-xs">
                            <button onclick="ui.reportDimension = 'overview'; renderApp()" class="px-3 py-1.5 rounded-lg font-medium transition ${ui.reportDimension === 'overview' ? 'bg-ink-wood text-white' : 'text-ink-gray hover:text-ink-charcoal'}">经营总览</button>
                            <button onclick="ui.reportDimension = 'channels'; renderApp()" class="px-3 py-1.5 rounded-lg font-medium transition ${ui.reportDimension === 'channels' ? 'bg-ink-wood text-white' : 'text-ink-gray hover:text-ink-charcoal'}">按来源统计</button>
                            <button onclick="ui.reportDimension = 'creators'; renderApp()" class="px-3 py-1.5 rounded-lg font-medium transition ${ui.reportDimension === 'creators' ? 'bg-ink-wood text-white' : 'text-ink-gray hover:text-ink-charcoal'}">按主播统计</button>
                            <button onclick="ui.reportDimension = 'rooms'; renderApp()" class="px-3 py-1.5 rounded-lg font-medium transition ${ui.reportDimension === 'rooms' ? 'bg-ink-wood text-white' : 'text-ink-gray hover:text-ink-charcoal'}">按房间统计</button>
                        </div>

                        <div class="flex flex-wrap items-center gap-2 text-xs">
                            <span class="text-ink-gray">订单范围：</span>
                            <select onchange="ui.reportScope = this.value; renderApp()" class="px-3 py-1.5 rounded-xl bg-ink-paper border border-ink-border font-medium">
                                <option value="ALL" ${ui.reportScope === 'ALL' ? 'selected' : ''}>全部有效订单（默认）</option>
                                <option value="NOT_CHECKED_IN" ${ui.reportScope === 'NOT_CHECKED_IN' ? 'selected' : ''}>未入住订单（待确认+待入住）</option>
                                <option value="CHECKED_IN" ${ui.reportScope === 'CHECKED_IN' ? 'selected' : ''}>已入住订单（已入住+已完成）</option>
                            </select>

                            <select onchange="ui.month = this.value; renderApp()" class="px-3 py-1.5 rounded-xl bg-ink-paper border border-ink-border font-semibold">
                                <option value="2026-11" ${ui.month === '2026-11' ? 'selected' : ''}>2026年 11月</option>
                                <option value="2026-12" ${ui.month === '2026-12' ? 'selected' : ''}>2026年 12月</option>
                            </select>
                        </div>
                    </div>

                    ${ui.reportDimension === 'overview' ? `
                        <div class="bg-white p-6 rounded-2xl border border-ink-border space-y-5">
                            <div class="flex items-center justify-between">
                                <h3 class="font-serif font-bold text-base text-ink-charcoal">${ui.month} 整体经营月报（跨月订单按间夜平均分摊，尾差归最后一晚）</h3>
                                <span class="text-xs text-ink-gray">净利润固定按已入住订单到手金额减全店支出计算</span>
                            </div>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs">
                                <div class="p-4 rounded-2xl bg-ink-paper border border-ink-border">
                                    <div class="text-ink-gray">归属本月订单数</div>
                                    <div class="text-xl font-bold mt-1 font-mono">${m.orderCount} 笔</div>
                                </div>
                                <div class="p-4 rounded-2xl bg-ink-paper border border-ink-border">
                                    <div class="text-ink-gray">本月分摊间夜数</div>
                                    <div class="text-xl font-bold mt-1 font-mono">${m.nightCount} 间夜</div>
                                </div>
                                <div class="p-4 rounded-2xl bg-ink-paper border border-ink-border">
                                    <div class="text-ink-gray">筛选口径营业额</div>
                                    <div class="text-xl font-bold text-ink-cinnabar mt-1 font-mono">¥${fmtMoney(m.paidAmount)}</div>
                                </div>
                                <div class="p-4 rounded-2xl bg-ink-paper border border-ink-border">
                                    <div class="text-ink-gray">筛选口径到手金额</div>
                                    <div class="text-xl font-bold text-ink-celadon mt-1 font-mono">¥${fmtMoney(m.netAmount)}</div>
                                </div>
                                <div class="p-4 rounded-2xl bg-ink-paper border border-ink-border">
                                    <div class="text-ink-gray">平台手续费</div>
                                    <div class="text-lg font-bold mt-1 font-mono">¥${fmtMoney(m.platformFee)}</div>
                                </div>
                                <div class="p-4 rounded-2xl bg-ink-paper border border-ink-border">
                                    <div class="text-ink-gray">普通达人提成 / 额外提成</div>
                                    <div class="text-lg font-bold mt-1 font-mono">¥${fmtMoney(m.platformCommission)} / ¥${fmtMoney(m.extraCommission)}</div>
                                </div>
                                <div class="p-4 rounded-2xl bg-ink-paper border border-ink-border">
                                    <div class="text-ink-gray">已入住入住率</div>
                                    <div class="text-lg font-bold text-ink-wood mt-1 font-mono">${m.occupancyRate}</div>
                                    <div class="text-[10px] text-ink-gray mt-0.5">${m.checkedInNightsTotal} / (${m.totalCalendarNights}-${m.blockedNights}) 间夜</div>
                                </div>
                                <div class="p-4 rounded-2xl bg-ink-woodLight border border-ink-wood/25">
                                    <div class="text-ink-woodDark font-semibold">当月固定净利润</div>
                                    <div class="text-xl font-bold text-ink-wood mt-1 font-mono">¥${fmtMoney(m.operatingProfit)}</div>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <div class="bg-white rounded-2xl border border-ink-border overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs min-w-[920px]">
                                <thead>
                                    <tr class="bg-ink-paper border-b border-ink-border text-ink-gray">
                                        <th class="py-3 px-4 font-semibold">统计维度名称</th>
                                        <th class="py-3 px-3 text-right font-semibold">订单数</th>
                                        <th class="py-3 px-3 text-right font-semibold">间夜数</th>
                                        <th class="py-3 px-3 text-right font-semibold">营业额(实付)</th>
                                        <th class="py-3 px-3 text-right font-semibold">平台手续费</th>
                                        <th class="py-3 px-3 text-right font-semibold">普通达人提成</th>
                                        <th class="py-3 px-3 text-right font-semibold">额外达人提成</th>
                                        <th class="py-3 px-3 text-right font-semibold">总提成</th>
                                        <th class="py-3 px-4 text-right font-semibold">${ui.reportDimension === 'rooms' ? '房间利润 / 入住率' : '商家到手金额'}</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-ink-border/70">
                                    ${activeRows.map(r => `
                                        <tr class="hover:bg-ink-paper/45">
                                            <td class="py-3 px-4 font-bold text-ink-charcoal">${r.name}</td>
                                            <td class="py-3 px-3 text-right font-mono">${r.order_count}</td>
                                            <td class="py-3 px-3 text-right font-mono">${r.night_count}</td>
                                            <td class="py-3 px-3 text-right font-mono font-semibold text-ink-cinnabar">¥${fmtMoney(r.paid)}</td>
                                            <td class="py-3 px-3 text-right font-mono">¥${fmtMoney(r.fee)}</td>
                                            <td class="py-3 px-3 text-right font-mono">¥${fmtMoney(r.pComm)}</td>
                                            <td class="py-3 px-3 text-right font-mono">¥${fmtMoney(r.eComm)}</td>
                                            <td class="py-3 px-3 text-right font-mono font-medium">¥${fmtMoney(r.pComm + r.eComm)}</td>
                                            <td class="py-3 px-4 text-right font-mono font-bold text-ink-celadon">
                                                ¥${fmtMoney(r.net)}
                                                ${r.occRate ? `<span class="ml-1.5 px-1.5 py-0.5 rounded bg-ink-woodLight text-ink-wood text-[10px]">${r.occRate}</span>` : ''}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;
        }

        // =========================================================================
        // 5. 总控渲染引擎
        // =========================================================================
        function renderApp() {
            const navEl = document.getElementById('sidebar-nav');
            navEl.innerHTML = NAV_ITEMS.map(item => {
                const active = ui.tab === item.id;
                return `
                    <button onclick="switchTab('${item.id}')" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl font-medium transition ${
                        active
                        ? 'bg-ink-wood text-white shadow-sm'
                        : 'text-white/70 hover:text-white hover:bg-white/5'
                    }">
                        <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0"></i>
                        <span>${item.label}</span>
                    </button>
                `;
            }).join('');

            const curNav = NAV_ITEMS.find(n => n.id === ui.tab);
            document.getElementById('page-heading').textContent = curNav ? curNav.label : '经营总览';

            const views = {
                dashboard: renderDashboard,
                calendar:  renderCalendar,
                orders:    renderOrders,
                rooms:     renderRooms,
                members:   renderMembers,
                channels:  renderChannels,
                expenses:  renderExpenses,
                reports:   renderReports
            };

            const main = document.getElementById('main-content');
            main.innerHTML = (views[ui.tab] || renderDashboard)();
            lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
