name: qianxun

services:
  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]

  mysql:
    image: ${DOCKER_REGISTRY_PREFIX:-docker.m.daocloud.io}/library/mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qianxun}
      MYSQL_USER: ${MYSQL_USER:-qianxun}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qianxun}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qianxun}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY_PREFIX: ${DOCKER_REGISTRY_PREFIX:-docker.m.daocloud.io}
        MAVEN_MIRROR_PROFILE: ${MAVEN_MIRROR_PROFILE:-aliyun}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      DATABASE_URL: ${DATABASE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-qianxun}?user=${MYSQL_USER:-qianxun}&password=${MYSQL_PASSWORD:-qianxun}&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai}
      JWT_SECRET: ${JWT_SECRET:?请在所选环境的 env 文件中设置 JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_PUBLIC_BASE_URL: ${COS_PUBLIC_BASE_URL:-}
      MEMBER_DEFAULT_AVATAR: ${MEMBER_DEFAULT_AVATAR:-/assets/member-default-avatar.png}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_MERCHANT_SERIAL: ${WECHAT_PAY_MERCHANT_SERIAL:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-/run/secrets/wechat/apiclient_key.pem}
      WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID:-}
      WECHAT_PAY_PUBLIC_KEY_PATH: ${WECHAT_PAY_PUBLIC_KEY_PATH:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_REFUND_NOTIFY_URL: ${WECHAT_REFUND_NOTIFY_URL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      MAIL_NOTIFICATION_RECIPIENTS: ${MAIL_NOTIFICATION_RECIPIENTS:-}
      MAIL_SENDER_NAME: ${MAIL_SENDER_NAME:-芊浔民宿}
      MAIL_DAILY_ROOM_STATUS_CRON: ${MAIL_DAILY_ROOM_STATUS_CRON:-0 0 10,18 * * *}
      TZ: Asia/Shanghai
    volumes:
      - ${WECHAT_PAY_KEY_DIR:-./secrets}:/run/secrets/wechat:ro
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    stop_grace_period: 30s

  admin:
    build:
      context: ../frontend/admin
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY_PREFIX: ${DOCKER_REGISTRY_PREFIX:-docker.m.daocloud.io}
        VITE_API_BASE_URL: /
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_BIND_ADDRESS:-0.0.0.0}:${ADMIN_HTTP_PORT:-8081}:80"

volumes:
  mysql_data:
