# HTTP 自动跳转 HTTPS
server {
    listen 80;
    server_name 111.229.107.194;

    return 301 https://$host$request_uri;
}

# HTTPS 服务
server {
    listen 443 ssl;
    server_name 111.229.107.194;

    # 免费 HTTPS 证书
    ssl_certificate /etc/letsencrypt/live/111.229.107.194/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/111.229.107.194/privkey.pem;

    # TLS 安全协议
    ssl_protocols TLSv1.2 TLSv1.3;

    # Nginx 默认网页目录
    root /var/www/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}